<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeQuest — гра з вебкодингу</title>
  <meta name="description" content="Україномовна гра-тренажер з HTML, CSS і JavaScript: виконуй завдання, здобувай досвід, відкривай нагороди та сертифікат." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Nunito:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cq-page: #f7f4e9;
      --cq-surface: #fffefa;
      --cq-ink: #282d47;
      --cq-muted: #77798a;
      --cq-primary: #188369;
      --cq-accent: #f1c544;
      --cq-hero: #282d47;
      --cq-border: #e3dfd2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--cq-page);
      color: var(--cq-ink);
      line-height: 1.5;
      min-height: 100vh;
      transition: background-color 0.25s, color 0.25s;
    }

    body.night-sky {
      --cq-page: #1b2038;
      --cq-surface: #252b48;
      --cq-ink: #f5f2eb;
      --cq-muted: #a6adc8;
      --cq-border: #384066;
    }

    .cq-header {
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .cq-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font: 700 22px 'Space Grotesk', sans-serif;
      color: var(--cq-ink);
      text-decoration: none;
    }
      .cq-brand img {
        display: block;
        width: 80px;
        height: 80px;
        flex: 0 0 80px;
      }

    .cq-brand-dot { color: var(--cq-primary); }

    .cq-nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      background: var(--cq-surface);
      padding: 6px;
      border-radius: 999px;
      border: 1px solid var(--cq-border);
    }

    .cq-nav a {
      text-decoration: none;
      color: var(--cq-muted);
      font-weight: 800;
      font-size: 14px;
      padding: 7px 14px;
      border-radius: 999px;
      transition: 0.15s;
    }

    .cq-nav a:hover { color: var(--cq-ink); }
    .cq-nav a.active {
      background: var(--cq-primary);
      color: #fff;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 800;
      color: var(--cq-muted);
    }

    .avatar-mark {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--cq-accent);
      color: #282d47;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
    }

    .cq-main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 20px 60px;
    }

    .cq-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 20px;
    }

    .span-4 { grid-column: span 4; }
    .span-5 { grid-column: span 5; }
    .span-6 { grid-column: span 6; }
    .span-7 { grid-column: span 7; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }

    @media (max-width: 820px) {
      .span-4, .span-5, .span-6, .span-7, .span-8 { grid-column: span 12; }
    }

    .cq-card {
      background: var(--cq-surface);
      border: 1px solid var(--cq-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 6px 20px rgba(40, 45, 71, 0.04);
    }

    .cq-kicker {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 12px;
      font-weight: 900;
      color: var(--cq-primary);
    }

    .cq-title {
      font: 700 38px/1.1 'Space Grotesk', sans-serif;
      margin: 6px 0 10px;
    }

    .cq-subtitle {
      color: var(--cq-muted);
      font-size: 16px;
      max-width: 580px;
    }

    .cq-small {
      font-size: 13px;
      font-weight: 700;
      color: var(--cq-muted);
    }

    .cq-mono { font-family: 'DM Mono', monospace; }

    .cq-pagehead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .cq-hero {
      background: var(--cq-hero);
      color: #fff9e8;
      border-radius: 30px;
      padding: 40px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 28px;
      align-items: center;
    }

    @media (max-width: 760px) {
      .cq-hero { grid-template-columns: 1fr; padding: 28px; }
    }

    .cq-hero h1 {
      font: 700 46px/1.05 'Space Grotesk', sans-serif;
      margin: 10px 0 14px;
    }

    .cq-hero p {
      color: #d3d6e2;
      font-size: 17px;
      margin-bottom: 24px;
    }

    .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }

    .stat-row {
      display: flex;
      gap: 28px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      flex-wrap: wrap;
    }

    .stat-row strong {
      display: block;
      font: 700 24px 'Space Grotesk', sans-serif;
      color: var(--cq-accent);
    }

    .stat-row span { font-size: 13px; color: #c7cad9; }
      .creative-note {
        padding: 32px;
        color: #fff9e8;
        background: linear-gradient(135deg, rgba(24, 131, 105, 0.94), rgba(40, 45, 71, 0.94));
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 28px;
        opacity: 0.92;
        transform: rotate(-3deg);
        animation: note-float 5s ease-in-out infinite alternate;
      }

      @keyframes note-float {
        from { transform: rotate(-3deg) translate(-4px, -3px); }
        to { transform: rotate(2deg) translate(5px, 4px); }
      }

      .image-gallery {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 14px;
      }

      .image-gallery img {
        display: block;
        width: 100%;
        height: 130px;
        object-fit: cover;
        border: 1px solid var(--cq-border);
        border-radius: 18px;
        box-shadow: 0 6px 18px rgba(40, 45, 71, 0.12);
      }

      .image-gallery img:nth-child(3n + 1) { height: 160px; }
      .image-gallery img:nth-child(3n + 2) { align-self: end; border-radius: 50% 18px 50% 18px; }

      @media (max-width: 760px) {
        .image-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

    .cq-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: 14px;
      font: 800 14px 'Nunito', sans-serif;
      border: 1px solid transparent;
      background: var(--cq-primary);
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s, opacity 0.15s;
    }

    .cq-btn:hover { transform: translateY(-1px); opacity: 0.95; }
    .cq-btn.gold { background: var(--cq-accent); color: #282d47; }
    .cq-btn.ghost {
      background: transparent;
      border-color: var(--cq-border);
      color: inherit;
    }
    .cq-hero .cq-btn.ghost { border-color: rgba(255,255,255,0.25); color: #fff; }

    .cq-progress {
      width: 100%;
      height: 12px;
      background: rgba(40, 45, 71, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .cq-progress span {
      display: block;
      height: 100%;
      background: var(--cq-primary);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .challenge-editor {
      width: 100%;
      min-height: 120px;
      margin-top: 8px;
      padding: 14px;
      border-radius: 16px;
      border: 2px solid var(--cq-border);
      background: var(--cq-page);
      color: var(--cq-ink);
      font: 500 15px 'DM Mono', monospace;
      resize: vertical;
    }

    .challenge-editor:focus {
      outline: none;
      border-color: var(--cq-primary);
    }

    .challenge-preview {
      min-height: 150px;
      border-radius: 18px;
      border: 2px dashed var(--cq-border);
      background: var(--cq-page);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .cq-field { display: flex; flex-direction: column; gap: 6px; }
    .cq-field label { font-size: 13px; font-weight: 800; }
    .cq-field input, .cq-field select, .cq-field textarea {
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--cq-border);
      background: var(--cq-page);
      color: var(--cq-ink);
      font: inherit;
    }

    .reward-option {
      text-align: center;
      cursor: pointer;
      transition: 0.18s;
      color: inherit;
    }
    .reward-option.selected {
      border: 2px solid var(--cq-primary);
      box-shadow: 0 0 0 3px rgba(24, 131, 105, 0.15);
    }
    .reward-option.locked { opacity: 0.6; }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .palette-btn {
      padding: 12px;
      border-radius: 16px;
      border: 2px solid var(--cq-border);
      background: var(--cq-surface);
      color: var(--cq-ink);
      text-align: left;
      cursor: pointer;
    }
    .palette-btn.active { border-color: var(--cq-primary); }
    .swatches {
      display: flex;
      height: 36px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .swatches span { flex: 1; }

    @media print {
      .cq-header, .print-hide { display: none !important; }
      body { background: #fff; }
      .cq-card { border: none; box-shadow: none; padding: 0; }
    }
  </style>
</head>

          profile: { ...defaultState.profile, ...(parsed.profile || {}) }

            <div class="cq-kicker">Трофей мандрівника</div>
            <h1 class="cq-title">Сертифікат</h1>
            <p class="cq-subtitle">Персональний доказ твоїх навичок — сформований з імені, досвіду та рівня.</p>
          </div>
        </div>
        <div class="cq-grid">
          <section class="cq-card span-8">
            <img src="${dataUrl}" alt="Сертифікат CodeQuest" style="width:100%;height:auto;border-radius:14px;display:block;" />
          </section>
          <aside class="cq-card span-4 print-hide" style="align-self:start;">
            <h2 style="font:700 22px 'Space Grotesk';margin-bottom:8px;">
              ${rem === 0 ? '🎉 Усі завдання виконано!' : `Виконано ${state.completed.length} із ${TASKS.length}`}
            </h2>
            <p class="cq-small" style="margin-bottom:18px;">
              ${rem === 0 ? 'Твій сертифікат повністю готовий до збереження.' : `Ти можеш завантажити сертифікат вже зараз або пройти ще ${rem} завдань для повного результату.`}
            </p>
            <div style="display:grid;gap:10px;">
              <button class="cq-btn" onclick="downloadCertPng()">Завантажити PNG</button>
              <button class="cq-btn ghost" onclick="downloadCertSvg()">Завантажити SVG</button>
              <button class="cq-btn gold" onclick="window.print()">Друкувати / PDF</button>
            </div>
          </aside>
        </div>
      `;
    }

    window.openTask = function(idx) {
      currentTaskIndex = idx;
      location.hash = "#/challenge";
    };

    window.changeTask = function(delta) {
      const next = currentTaskIndex + delta;
      if (next >= 0 && next < TASKS.length) {
        currentTaskIndex = next;
        renderRoute();
      }
    };

    window.checkAnswer = function() {
      const input = document.getElementById("code-input").value;
      const task = TASKS[currentTaskIndex];
      const isOk = task.answers.some(ans => normalizeCode(ans) === normalizeCode(input));
      const statusBox = document.getElementById("status-box");
      const previewBox = document.getElementById("preview-box");

      if (isOk) {
        const firstTime = !state.completed.includes(task.id);
        if (firstTime) {
          state.completed.push(task.id);
          state.xp += task.xp;
          saveState();
        }
        previewBox.innerHTML = task.preview;
        statusBox.innerHTML = `
          <div style="background:#e2f2e8;color:#126f57;padding:14px;border-radius:12px;">
            <strong>Чудово! ${firstTime ? `+${task.xp} XP` : 'Вже зараховано'}</strong>
            <div style="margin-top:8px;">
              ${currentTaskIndex < TASKS.length - 1
                ? `<button class="cq-btn gold" onclick="changeTask(1)">Наступне завдання →</button>`
                : `<a class="cq-btn gold" href="#/certificate">Перейти до сертифіката →</a>`}
            </div>
          </div>
        `;
      } else {
        statusBox.innerHTML = `<p class="cq-small" style="color:#c34d4d;">Перевір порядок властивостей, дужок і крапок з комою.</p>`;
      }
    };

    window.toggleHint = function() {
      const box = document.getElementById("hint-box");
      box.style.display = box.style.display === "none" ? "block" : "none";
    };

    window.fillAnswer = function() {
      document.getElementById("code-input").value = TASKS[currentTaskIndex].answers[0];
    };

    window.selectAvatar = function(id, unlock) {
      const msg = document.getElementById("reward-msg");
      if (state.xp < unlock) {
        msg.textContent = `Потрібно ще ${unlock - state.xp} XP, щоб відкрити цей аватар!`;
        return;
      }
      state.avatar = id;
      saveState();
      renderRoute();
    };

    window.selectBg = function(id, unlock) {
      const msg = document.getElementById("reward-msg");
      if (state.xp < unlock) {
        msg.textContent = `Потрібно ще ${unlock - state.xp} XP, щоб відкрити це тло!`;
        return;
      }
      state.background = id;
      saveState();
      renderRoute();
    };

    window.changePalette = function(id) {
      state.profile.paletteId = id;
      saveState();
      renderRoute();
    };

    window.saveProfileForm = function(e) {
      e.preventDefault();
      state.profile.name = document.getElementById("prof-name").value.trim() || "Мандрівник";
      state.profile.goal = document.getElementById("prof-goal").value;
      state.profile.bio = document.getElementById("prof-bio").value.trim();
      state.profile.email = document.getElementById("prof-email").value.trim();
      state.profile.practiceDate = document.getElementById("prof-date").value;
      state.profile.practiceMinutes = Number(document.getElementById("prof-minutes").value);
      state.profile.favoriteColor = document.getElementById("prof-color").value;
      state.profile.reminder = document.getElementById("prof-reminder").checked;
      saveState();
      document.getElementById("prof-status").textContent = "✓ Збережено!";
    };

    window.resetAllProgress = function() {
      if (confirm("Скинути весь досвід і виконані завдання?")) {
        state = structuredClone(defaultState);
        saveState();
        renderRoute();
      }
    };

    window.downloadCertSvg = function() {
      const svg = buildCertificateSvg();
      const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
      triggerDownload(blob, "certificate-codequest.svg");
    };

    window.downloadCertPng = function() {
      const svg = buildCertificateSvg();
      const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = 1200;
        canvas.height = 840;
        canvas.getContext("2d").drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob => triggerDownload(blob, "certificate-codequest.png"), "image/png");
      };
      img.src = url;
    };

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function renderRoute() {
      const hash = location.hash.replace(/^#/, "") || "/";
      const app = document.getElementById("app");

      document.querySelectorAll("#main-nav a").forEach(a => {
        a.classList.toggle("active", a.getAttribute("data-route") === hash);
      });

      if (hash === "/learn") app.innerHTML = renderLearn();
      else if (hash === "/challenge") app.innerHTML = renderChallenge();
      else if (hash === "/rewards") app.innerHTML = renderRewards();
      else if (hash === "/profile") app.innerHTML = renderProfile();
      else if (hash === "/certificate") app.innerHTML = renderCertificate();
      else app.innerHTML = renderHome();
    }

    window.addEventListener("hashchange", renderRoute);
    applyTheme();
    updateHeader();
    renderRoute();
  </script>
</body>
</html>
